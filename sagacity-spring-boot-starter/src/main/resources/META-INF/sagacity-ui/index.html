<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sagacity</title>
  <style>
    :root {
      --bg:        #f6f8fa;
      --surface:   #ffffff;
      --surface2:  #f6f8fa;
      --border:    #d0d7de;
      --border-light: #eaeef2;
      --muted:     #636c76;
      --text:      #1f2328;
      --text-dim:  #24292f;
      --green:     #1a7f37;
      --green-bg:  #dafbe1;
      --green-border: #82e09c;
      --amber:     #9a6700;
      --amber-bg:  #fff8c5;
      --amber-border: #d4a72c;
      --red:       #cf222e;
      --red-bg:    #ffebe9;
      --red-border:#ffa198;
      --blue:      #0969da;
      --blue-bg:   #ddf4ff;
      --blue-border:#54aeff;
      --purple:    #8250df;
      --purple-bg: #fbefff;
      --radius:    8px;
      --font:      'Inter', 'Segoe UI', system-ui, sans-serif;
      --font-mono: 'JetBrains Mono', 'Fira Code', ui-monospace, monospace;
      --shadow-sm: 0 1px 3px rgba(31,35,40,.06), 0 1px 2px rgba(31,35,40,.04);
      --shadow-md: 0 3px 8px rgba(31,35,40,.08), 0 1px 3px rgba(31,35,40,.05);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── NAV ──────────────────────────────────── */
    nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      height: 52px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: var(--shadow-sm);
    }

    .nav-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
      text-decoration: none;
    }

    .logo-mark {
      width: 28px; height: 28px;
      background: linear-gradient(135deg, #1a7f37, #0969da);
      border-radius: 7px;
      display: grid;
      place-items: center;
      font-size: 13px;
      color: #fff;
      font-weight: 800;
      letter-spacing: -1px;
    }

    .nav-tabs { display: flex; gap: 2px; }

    .nav-tab {
      padding: 6px 16px;
      border-radius: 6px;
      font-size: 13px;
      color: var(--muted);
      cursor: pointer;
      border: none;
      background: none;
      font-family: var(--font);
      transition: background .12s, color .12s;
      font-weight: 500;
    }

    .nav-tab:hover { background: var(--bg); color: var(--text); }
    .nav-tab.active { background: var(--blue-bg); color: var(--blue); font-weight: 600; }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 12px;
      color: var(--muted);
    }

    .btn-refresh {
      display: flex; align-items: center; gap: 5px;
      padding: 5px 12px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      font-size: 12px;
      cursor: pointer;
      font-family: var(--font);
      font-weight: 500;
      transition: border-color .12s, color .12s, background .12s;
    }

    .btn-refresh:hover { border-color: var(--blue); color: var(--blue); background: var(--blue-bg); }

    /* ── LAYOUT ───────────────────────────────── */
    main { padding: 20px 24px; max-width: 1360px; margin: 0 auto; }

    .page { display: none; }
    .page.active { display: block; }

    /* ── STAT STRIP ───────────────────────────── */
    .stats {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .stat {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 18px;
      min-width: 110px;
      box-shadow: var(--shadow-sm);
    }

    .stat-label { font-size: 11px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .4px; }
    .stat-value { font-size: 24px; font-weight: 700; margin-top: 4px; line-height: 1; }
    .stat.green .stat-value { color: var(--green); }
    .stat.amber .stat-value { color: var(--amber); }
    .stat.red   .stat-value { color: var(--red); }
    .stat.blue  .stat-value { color: var(--blue); }

    /* ── WORKFLOW CARDS GRID ──────────────────── */
    .workflow-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }

    .workflow-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      box-shadow: var(--shadow-sm);
      transition: box-shadow .15s;
    }

    .workflow-card:hover { box-shadow: var(--shadow-md); }

    .wf-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .wf-name {
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
    }

    .wf-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 3px;
    }

    .wf-id {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--muted);
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 1px 6px;
      cursor: pointer;
    }

    .wf-id:hover { border-color: var(--blue); color: var(--blue); }

    .wf-time {
      font-size: 11px;
      color: var(--muted);
    }

    /* ── FLOW GRAPH ───────────────────────────── */
    .flow {
      display: flex;
      align-items: center;
      gap: 0;
      overflow-x: auto;
      padding: 4px 0 10px;
      position: relative;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }

    .flow::-webkit-scrollbar { height: 4px; }
    .flow::-webkit-scrollbar-track { background: transparent; }
    .flow::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    /* Compensation path sits below the main flow */
    .flow-wrap { position: relative; }

    .flow-node {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      position: relative;
    }

    .node-box {
      border-radius: 8px;
      border: 1.5px solid;
      padding: 8px 14px;
      min-width: 120px;
      max-width: 160px;
      text-align: center;
      position: relative;
      cursor: default;
    }

    .node-order {
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .5px;
      margin-bottom: 2px;
      opacity: .7;
    }

    .node-name {
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .node-tag {
      font-size: 9px;
      margin-top: 2px;
      opacity: .75;
      font-family: var(--font-mono);
    }

    /* Node states */
    .node-completed {
      background: var(--green-bg);
      border-color: var(--green-border);
      color: var(--green);
    }

    .node-running {
      background: var(--blue-bg);
      border-color: var(--blue-border);
      color: var(--blue);
    }

    .node-gate {
      background: var(--amber-bg);
      border-color: var(--amber-border);
      color: var(--amber);
    }

    .node-failed {
      background: var(--red-bg);
      border-color: var(--red-border);
      color: var(--red);
    }

    .node-pending {
      background: var(--surface2);
      border-color: var(--border);
      border-style: dashed;
      color: var(--muted);
    }

    .node-compensation {
      background: #fff3e0;
      border-color: #f0883e;
      color: #9a4700;
    }

    /* ── ARROWS ───────────────────────────────── */
    .flow-arrow {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 36px;
      position: relative;
    }

    .arrow-line {
      width: 24px;
      height: 1.5px;
      background: var(--border);
      position: relative;
    }

    .arrow-line::after {
      content: '';
      position: absolute;
      right: -4px;
      top: -3px;
      border: 4px solid transparent;
      border-left-color: var(--border);
    }

    .arrow-line.green { background: var(--green); }
    .arrow-line.green::after { border-left-color: var(--green); }

    .arrow-line.blue { background: var(--blue); border-style: dashed; background: repeating-linear-gradient(90deg,var(--blue) 0,var(--blue) 4px,transparent 4px,transparent 8px); }
    .arrow-line.blue::after { border-left-color: var(--blue); }

    .arrow-label {
      font-size: 9px;
      color: var(--muted);
      white-space: nowrap;
      margin-top: 2px;
    }

    /* ── COMPENSATION ROW ─────────────────────── */
    .comp-row {
      display: flex;
      align-items: center;
      gap: 0;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px dashed var(--border-light);
    }

    .comp-label {
      font-size: 10px;
      color: var(--muted);
      font-weight: 600;
      margin-right: 8px;
      white-space: nowrap;
    }

    .comp-arrow {
      width: 24px;
      height: 1.5px;
      background: repeating-linear-gradient(90deg,#f0883e 0,#f0883e 4px,transparent 4px,transparent 8px);
      position: relative;
      flex-shrink: 0;
    }

    .comp-arrow.left::before {
      content: '';
      position: absolute;
      left: -4px;
      top: -3px;
      border: 4px solid transparent;
      border-right-color: #f0883e;
    }

    /* ── CARD FOOTER ──────────────────────────── */
    .wf-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid var(--border-light);
    }

    .wf-failure {
      font-size: 11px;
      color: var(--red);
      display: flex;
      align-items: center;
      gap: 4px;
      max-width: 280px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* ── BADGES ───────────────────────────────── */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 9px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
    }

    .badge::before { content:''; width:6px; height:6px; border-radius:50%; background:currentColor; flex-shrink:0; }

    .badge-completed   { background: var(--green-bg);  color: var(--green); }
    .badge-running     { background: var(--blue-bg);   color: var(--blue); }
    .badge-gate        { background: var(--amber-bg);  color: var(--amber); }
    .badge-failed      { background: var(--red-bg);    color: var(--red); }
    .badge-compensating{ background: #fff3e0;           color: #9a4700; }

    /* ── ACTION BUTTONS ───────────────────────── */
    .btn {
      padding: 4px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      border: 1.5px solid;
      font-family: var(--font);
      transition: opacity .12s, background .12s;
    }

    .btn:hover { opacity: .85; }
    .btn:disabled { opacity: .4; cursor: default; }
    .btn-approve { background: var(--green-bg); color: var(--green); border-color: var(--green-border); }
    .btn-reject  { background: var(--red-bg);   color: var(--red);   border-color: var(--red-border); }
    .btn-detail  { background: var(--surface2); color: var(--muted); border-color: var(--border); }
    .btn-gap     { display: flex; gap: 6px; }

    /* ── APPROVALS / AUDIT TABLE ──────────────── */
    .table-wrap {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      margin-bottom: 20px;
      box-shadow: var(--shadow-sm);
    }

    table { width:100%; border-collapse: collapse; font-size: 13px; }

    th {
      text-align: left;
      padding: 10px 16px;
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .5px;
      border-bottom: 1px solid var(--border);
      background: var(--surface2);
    }

    td {
      padding: 11px 16px;
      color: var(--text-dim);
      border-bottom: 1px solid var(--border-light);
      vertical-align: middle;
    }

    tr:last-child td { border-bottom: none; }
    tr:hover td { background: var(--surface2); }

    .mono { font-family: var(--font-mono); font-size: 11px; }

    /* ── EMPTY STATE ──────────────────────────── */
    .empty {
      padding: 48px 24px;
      text-align: center;
      color: var(--muted);
    }

    .empty-icon { font-size: 32px; margin-bottom: 12px; }
    .empty-title { font-size: 15px; color: var(--text-dim); font-weight: 600; margin-bottom: 6px; }
    .empty-sub { font-size: 13px; }

    /* ── SECTION HEADER ───────────────────────── */
    .section-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 12px;
    }

    .section-title { font-size: 14px; font-weight: 700; color: var(--text); }

    /* ── JOURNAL ──────────────────────────────── */
    .journal-entry {
      display: flex; gap: 12px; padding: 8px 0;
      border-bottom: 1px solid var(--border-light);
      font-size: 12px; align-items: flex-start;
    }

    .journal-entry:last-child { border-bottom: none; }
    .journal-seq   { color: var(--muted); width: 24px; flex-shrink:0; text-align:right; font-family: var(--font-mono); }
    .journal-phase { width: 100px; flex-shrink:0; font-weight:600; }
    .journal-tool  { color: var(--text-dim); flex:1; font-family: var(--font-mono); font-size:11px; }
    .journal-hash  { color: var(--muted); font-family: var(--font-mono); font-size:10px; }

    .phase-INTENT             { color: #1a7f37; opacity:.65; }
    .phase-EXECUTED           { color: var(--green); }
    .phase-FAILED             { color: var(--red); }
    .phase-COMPENSATED        { color: #9a4700; }
    .phase-COMPENSATION_FAILED{ color: var(--red); }
    .phase-AWAITING_APPROVAL  { color: var(--amber); }
    .phase-APPROVED           { color: var(--blue); }
    .phase-REJECTED           { color: var(--red); }

    /* ── DETAIL OVERLAY ───────────────────────── */
    .overlay {
      display: none;
      position: fixed; inset:0;
      background: rgba(31,35,40,.4);
      z-index: 200;
      padding: 24px;
      overflow-y: auto;
    }

    .overlay.open { display: flex; align-items: flex-start; justify-content: center; }

    .overlay-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      width: 100%; max-width: 680px;
      padding: 24px;
      position: relative;
      margin: auto;
      box-shadow: var(--shadow-md);
    }

    .overlay-close {
      position: absolute; top:16px; right:16px;
      background:none; border:none;
      color: var(--muted); font-size: 18px; cursor: pointer;
    }

    .overlay-close:hover { color: var(--text); }
    .overlay-title { font-size: 15px; font-weight: 700; margin-bottom: 4px; }
    .overlay-sub   { font-size: 12px; color: var(--muted); margin-bottom: 20px; }

    /* ── TOAST ────────────────────────────────── */
    #toast {
      position: fixed; bottom: 24px; right: 24px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 16px;
      font-size: 13px; color: var(--text);
      z-index: 999;
      opacity: 0; transform: translateY(8px);
      transition: opacity .2s, transform .2s;
      pointer-events: none; max-width: 320px;
      box-shadow: var(--shadow-md);
    }

    #toast.show { opacity:1; transform: translateY(0); }
    #toast.success { border-color: var(--green-border); color: var(--green); }
    #toast.error   { border-color: var(--red-border);   color: var(--red); }

    /* ── AUDIT INPUT ──────────────────────────── */
    .text-input {
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--surface);
      color: var(--text);
      font-size: 13px;
      font-family: var(--font);
      outline: none;
    }

    .text-input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px var(--blue-bg); }

    /* ── VERIFY ───────────────────────────────── */
    .verify-ok   { color: var(--green); font-size: 12px; font-weight: 600; }
    .verify-fail { color: var(--red);   font-size: 12px; font-weight: 600; }
  </style>
</head>
<body>

<nav>
  <a class="nav-brand" href="#">
    <span class="logo-mark">S</span>
    Sagacity
  </a>
  <div class="nav-tabs">
    <button class="nav-tab active" onclick="showPage('workflows')">Workflows</button>
    <button class="nav-tab" onclick="showPage('approvals')">Approvals <span id="approval-badge"></span></button>
    <button class="nav-tab" onclick="showPage('audit')">Audit</button>
  </div>
  <div class="nav-right">
    <span id="last-refresh"></span>
    <button class="btn-refresh" onclick="loadAll()">↻ Refresh</button>
  </div>
</nav>

<main>

  <!-- ═══════════════ WORKFLOWS ═══════════════ -->
  <div id="page-workflows" class="page active">
    <div class="stats" id="workflow-stats"></div>
    <div class="section-header">
      <span class="section-title">Workflow runs</span>
    </div>
    <div id="workflow-grid" class="workflow-grid">
      <div class="empty"><div class="empty-icon">⏳</div><div class="empty-title">Loading…</div></div>
    </div>
  </div>

  <!-- ═══════════════ APPROVALS ═══════════════ -->
  <div id="page-approvals" class="page">
    <div class="stats" id="approval-stats"></div>

    <div class="section-header">
      <span class="section-title">Gates awaiting approval</span>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Workflow</th><th>Run ID</th><th>Gate stage</th><th>Waiting since</th><th></th></tr></thead>
        <tbody id="gate-rows"></tbody>
      </table>
    </div>

    <div class="section-header" style="margin-top:4px">
      <span class="section-title">Saga approvals — irreversible tools</span>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Saga ID</th><th>Tool</th><th>Seq</th><th>Input preview</th><th>Requested at</th><th></th></tr></thead>
        <tbody id="saga-approval-rows"></tbody>
      </table>
    </div>
  </div>

  <!-- ═══════════════ AUDIT ════════════════════ -->
  <div id="page-audit" class="page">
    <div class="section-header">
      <span class="section-title">Audit trail lookup</span>
    </div>
    <div style="display:flex;gap:10px;margin-bottom:20px">
      <input id="audit-id-input" class="text-input" placeholder="Saga ID or Workflow Run ID" style="width:360px"/>
      <button class="btn-refresh" onclick="loadAudit()">Look up →</button>
    </div>
    <div id="audit-result"></div>
  </div>

</main>

<!-- ═══════════ JOURNAL OVERLAY ═══════════ -->
<div class="overlay" id="detail-overlay" onclick="closeOverlay(event)">
  <div class="overlay-panel">
    <button class="overlay-close" onclick="closeOverlayPanel()">✕</button>
    <div id="detail-content"></div>
  </div>
</div>

<div id="toast"></div>

<script>
  let workflows = [];
  let sagaApprovals = [];

  // ── ROUTING ───────────────────────────────────
  function showPage(name) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
    document.getElementById('page-' + name).classList.add('active');
    ['workflows','approvals','audit'].forEach((n, i) => {
      if (n === name) document.querySelectorAll('.nav-tab')[i].classList.add('active');
    });
  }

  // ── LOAD ──────────────────────────────────────
  async function loadAll() {
    await Promise.allSettled([loadWorkflows(), loadSagaApprovals()]);
    document.getElementById('last-refresh').textContent = 'Updated ' + new Date().toLocaleTimeString();
  }

  async function loadWorkflows() {
    try {
      const res = await fetch('/sagacity/workflows');
      workflows = res.ok ? await res.json() : [];
    } catch { workflows = []; }
    renderWorkflows();
  }

  async function loadSagaApprovals() {
    try {
      const res = await fetch('/sagacity/approvals');
      sagaApprovals = res.ok ? await res.json() : [];
    } catch { sagaApprovals = []; }
    renderSagaApprovals();
    renderGateApprovals();
  }

  // ── WORKFLOW CARDS ────────────────────────────
  function renderWorkflows() {
    const counts = { RUNNING:0, PAUSED_AT_GATE:0, COMPLETED:0, FAILED:0, COMPENSATING:0 };
    workflows.forEach(w => { if (counts[w.status] !== undefined) counts[w.status]++; });

    document.getElementById('workflow-stats').innerHTML = `
      <div class="stat blue"><div class="stat-label">Running</div><div class="stat-value">${counts.RUNNING}</div></div>
      <div class="stat amber"><div class="stat-label">At gate</div><div class="stat-value">${counts.PAUSED_AT_GATE}</div></div>
      <div class="stat green"><div class="stat-label">Completed</div><div class="stat-value">${counts.COMPLETED}</div></div>
      <div class="stat red"><div class="stat-label">Failed</div><div class="stat-value">${counts.FAILED + counts.COMPENSATING}</div></div>
      <div class="stat"><div class="stat-label">Total</div><div class="stat-value" style="color:var(--text)">${workflows.length}</div></div>
    `;

    const gateCount = counts.PAUSED_AT_GATE;
    document.getElementById('approval-badge').textContent = gateCount > 0 ? ` (${gateCount})` : '';

    const grid = document.getElementById('workflow-grid');
    if (!workflows.length) {
      grid.innerHTML = `<div class="empty">
        <div class="empty-icon">🔄</div>
        <div class="empty-title">No workflow runs yet</div>
        <div class="empty-sub">Runs appear here once a @Workflow executes</div>
      </div>`;
      return;
    }

    grid.innerHTML = workflows
      .sort((a, b) => b.startedAt.localeCompare(a.startedAt))
      .map(w => buildWorkflowCard(w))
      .join('');

    renderGateApprovals();
  }

  function buildWorkflowCard(w) {
    const completed = w.completedStages || [];
    const isGate     = w.status === 'PAUSED_AT_GATE';
    const isFailed   = w.status === 'FAILED' || w.status === 'COMPENSATING';
    const isDone     = w.status === 'COMPLETED';

    // Build stage nodes from completedStages + current state
    const allStageNames = [...completed];
    if (isGate && w.pendingGateStageName && !allStageNames.includes(w.pendingGateStageName)) {
      allStageNames.push(w.pendingGateStageName);
    }
    if (isFailed && w.currentStageOrder > 0) {
      // add a "Failed" marker
    }

    let flowHtml = '';
    allStageNames.forEach((name, i) => {
      const isLast = i === allStageNames.length - 1;
      const isGateNode = isGate && name === w.pendingGateStageName;
      const nodeClass = isGateNode ? 'node-gate' : 'node-completed';
      const icon = isGateNode ? '⏸' : '✓';

      flowHtml += `
        <div class="flow-node">
          <div class="node-box ${nodeClass}">
            <div class="node-order">${icon} Stage ${i + 1}</div>
            <div class="node-name">${esc(name)}</div>
          </div>
        </div>
      `;

      if (!isLast) {
        const arrowClass = isGateNode ? 'blue' : 'green';
        flowHtml += `
          <div class="flow-arrow">
            <div class="arrow-line ${arrowClass}"></div>
          </div>
        `;
      }
    });

    // If failed: add failed node
    if (isFailed) {
      if (allStageNames.length > 0) {
        flowHtml += `
          <div class="flow-arrow">
            <div class="arrow-line" style="background:var(--red)"></div>
          </div>
        `;
      }
      // Show "Stage N failed" — not the exception message (which is too long)
      const failedStageNum = (completed.length || 0) + 1;
      flowHtml += `
        <div class="flow-node">
          <div class="node-box node-failed">
            <div class="node-order">✗ Stage ${failedStageNum}</div>
            <div class="node-name">Failed</div>
          </div>
        </div>
      `;
    }

    // If completed and no stages tracked yet, show at least the final node
    if (isDone && allStageNames.length === 0) {
      flowHtml = `
        <div class="flow-node">
          <div class="node-box node-completed">
            <div class="node-order">✓ Complete</div>
            <div class="node-name">${esc(w.workflowName)}</div>
          </div>
        </div>
      `;
    }

    // Compensation row (for failed workflows)
    let compHtml = '';
    if (isFailed && completed.length > 0) {
      const reversed = [...completed].reverse();
      compHtml = `<div class="comp-row">
        <span class="comp-label">⟲ Compensation</span>
        ${reversed.map((name, i) => `
          ${i > 0 ? '<div class="comp-arrow left" style="width:24px"></div>' : ''}
          <div class="flow-node">
            <div class="node-box node-compensation" style="min-width:80px">
              <div class="node-order" style="font-size:9px">undo</div>
              <div class="node-name" style="font-size:11px">${esc(name)}</div>
            </div>
          </div>
        `).join('')}
      </div>`;
    }

    // Gate approval buttons
    const gateButtons = isGate && w.pendingGateStageName ? `
      <div class="btn-gap">
        <button class="btn btn-approve" onclick="approveGate('${esc(w.runId)}','${esc(w.pendingGateStageName)}')">Approve</button>
        <button class="btn btn-reject"  onclick="rejectGate('${esc(w.runId)}','${esc(w.pendingGateStageName)}')">Reject</button>
      </div>
    ` : `<div></div>`;

    return `
      <div class="workflow-card">
        <div class="wf-header">
          <div>
            <div class="wf-name">${esc(w.workflowName)}</div>
            <div class="wf-meta">
              <span class="wf-id" onclick="copyText('${esc(w.runId)}')" title="Click to copy">${esc(w.runId.slice(0,8))}…</span>
              <span class="wf-time">${fmtTime(w.startedAt)}</span>
            </div>
          </div>
          ${statusBadge(w.status)}
        </div>

        <div class="flow-wrap">
          <div class="flow">${flowHtml || '<div style="color:var(--muted);font-size:12px">Starting…</div>'}</div>
          ${compHtml}
        </div>

        <div class="wf-footer">
          ${w.failureReason && !isFailed ? `<div class="wf-failure">✗ ${esc(w.failureReason.slice(0,60))}</div>` : gateButtons}
          <button class="btn btn-detail" onclick="showDetail('${esc(w.runId)}')">Audit trail →</button>
        </div>
      </div>
    `;
  }

  // ── APPROVALS ─────────────────────────────────
  function renderGateApprovals() {
    const pending = workflows.filter(w => w.status === 'PAUSED_AT_GATE' && w.pendingGateStageName);

    document.getElementById('approval-stats').innerHTML = `
      <div class="stat amber"><div class="stat-label">Gates waiting</div><div class="stat-value">${pending.length}</div></div>
      <div class="stat amber"><div class="stat-label">Saga approvals</div><div class="stat-value">${sagaApprovals.length}</div></div>
    `;

    const tbody = document.getElementById('gate-rows');
    if (!tbody) return;
    if (!pending.length) {
      tbody.innerHTML = `<tr><td colspan="5"><div class="empty"><div class="empty-icon">✅</div><div class="empty-title">No gates waiting</div></div></td></tr>`;
      return;
    }
    tbody.innerHTML = pending.map(w => `
      <tr>
        <td><strong>${esc(w.workflowName)}</strong></td>
        <td><span class="mono" style="cursor:pointer" onclick="copyText('${esc(w.runId)}')">${esc(w.runId.slice(0,8))}…</span></td>
        <td><span style="color:var(--amber);font-weight:600">⏸ ${esc(w.pendingGateStageName)}</span></td>
        <td class="mono">${fmtTime(w.startedAt)}</td>
        <td><div class="btn-gap">
          <button class="btn btn-approve" onclick="approveGate('${esc(w.runId)}','${esc(w.pendingGateStageName)}')">Approve</button>
          <button class="btn btn-reject"  onclick="rejectGate('${esc(w.runId)}','${esc(w.pendingGateStageName)}')">Reject</button>
        </div></td>
      </tr>
    `).join('');
  }

  function renderSagaApprovals() {
    const tbody = document.getElementById('saga-approval-rows');
    if (!tbody) return;
    if (!sagaApprovals.length) {
      tbody.innerHTML = `<tr><td colspan="6"><div class="empty"><div class="empty-icon">✅</div><div class="empty-title">No saga approvals pending</div></div></td></tr>`;
      return;
    }
    tbody.innerHTML = sagaApprovals.map(a => `
      <tr>
        <td class="mono">${esc(a.sagaId)}</td>
        <td><strong>${esc(a.toolName)}</strong></td>
        <td class="mono">${a.journalSeq}</td>
        <td class="mono" style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc((a.input||'').slice(0,60))}</td>
        <td class="mono">${fmtTime(a.createdAt)}</td>
        <td><div class="btn-gap">
          <button class="btn btn-approve" onclick="approveSaga('${esc(a.sagaId)}',${a.journalSeq})">Approve</button>
          <button class="btn btn-reject"  onclick="rejectSaga('${esc(a.sagaId)}',${a.journalSeq})">Reject</button>
        </div></td>
      </tr>
    `).join('');
  }

  // ── AUDIT ─────────────────────────────────────
  async function loadAudit() {
    const id = document.getElementById('audit-id-input').value.trim();
    if (!id) { toast('Enter a saga ID or run ID', 'error'); return; }
    const el = document.getElementById('audit-result');
    el.innerHTML = '<div style="color:var(--muted);font-size:13px">Loading…</div>';
    try {
      const [jr, vr] = await Promise.all([
        fetch(`/sagacity/audit/${encodeURIComponent(id)}`),
        fetch(`/sagacity/audit/${encodeURIComponent(id)}/verify`)
      ]);
      let entries = [];
      if (jr.ok) {
        entries = (await jr.text()).trim().split('\n').filter(Boolean)
          .map(l => { try { return JSON.parse(l); } catch { return null; } }).filter(Boolean);
      }
      let verify = null;
      if (vr.ok) verify = await vr.json();
      if (!entries.length) {
        el.innerHTML = `<div class="empty"><div class="empty-icon">🔍</div><div class="empty-title">No entries found</div></div>`;
        return;
      }
      const vBadge = verify
        ? (verify.valid
            ? `<span class="verify-ok">✓ Chain verified — ${verify.entryCount} entries</span>`
            : `<span class="verify-fail">✗ Break at entry ${verify.breakAtIndex}</span>`)
        : '';
      el.innerHTML = `
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
          <span style="font-size:13px;font-weight:600">${entries.length} entries for <span class="mono">${esc(id)}</span></span>
          ${vBadge}
        </div>
        <div class="table-wrap"><div style="padding:4px 0" id="audit-entries"></div></div>
      `;
      renderJournal(entries, 'audit-entries');
    } catch (e) {
      el.innerHTML = `<div class="empty"><div class="empty-icon">⚠️</div><div class="empty-title">Request failed</div></div>`;
    }
  }

  function renderJournal(entries, containerId) {
    const el = document.getElementById(containerId);
    if (!el) return;
    el.innerHTML = entries.map(e => `
      <div class="journal-entry">
        <span class="journal-seq">${e.seq}</span>
        <span class="journal-phase phase-${e.phase}">${e.phase}</span>
        <span class="journal-tool">${esc(e.toolName)}</span>
        <span class="journal-hash">${(e.hash||'').slice(0,8)}…</span>
      </div>
    `).join('');
  }

  // ── DETAIL OVERLAY ────────────────────────────
  async function showDetail(runId) {
    const w = workflows.find(x => x.runId === runId);
    if (!w) return;
    const el = document.getElementById('detail-content');
    el.innerHTML = `
      <div class="overlay-title">${esc(w.workflowName)}</div>
      <div class="overlay-sub">${esc(runId)}  ${statusBadge(w.status)}</div>
      <div style="font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px">Journal</div>
      <div id="overlay-journal">Loading…</div>
    `;
    document.getElementById('detail-overlay').classList.add('open');
    try {
      const res = await fetch(`/sagacity/audit/${encodeURIComponent(runId)}`);
      if (res.ok) {
        const entries = (await res.text()).trim().split('\n').filter(Boolean)
          .map(l => { try { return JSON.parse(l); } catch { return null; } }).filter(Boolean);
        document.getElementById('overlay-journal').innerHTML =
          entries.length ? '' : '<span style="color:var(--muted);font-size:12px">No entries.</span>';
        if (entries.length) renderJournal(entries, 'overlay-journal');
      } else {
        document.getElementById('overlay-journal').innerHTML = '<span style="color:var(--muted);font-size:12px">No journal entries found.</span>';
      }
    } catch { document.getElementById('overlay-journal').innerHTML = '<span style="color:var(--muted)">Unavailable.</span>'; }
  }

  function closeOverlayPanel() { document.getElementById('detail-overlay').classList.remove('open'); }
  function closeOverlay(e) { if (e.target === document.getElementById('detail-overlay')) closeOverlayPanel(); }

  // ── GATE ACTIONS ──────────────────────────────
  async function approveGate(runId, stageName) {
    try {
      const res = await fetch(`/sagacity/workflows/${encodeURIComponent(runId)}/gates/${encodeURIComponent(stageName)}/approve`,
        { method:'POST', headers:{'Content-Type':'application/json'}, body:'{}' });
      const j = await res.json();
      if (res.ok) { toast(`✓ Gate approved: ${stageName}`, 'success'); setTimeout(loadAll, 500); }
      else toast(`Error: ${j.error||res.status}`, 'error');
    } catch { toast('Request failed', 'error'); }
  }

  async function rejectGate(runId, stageName) {
    const reason = prompt(`Reason for rejecting "${stageName}":`);
    if (reason === null) return;
    try {
      const res = await fetch(`/sagacity/workflows/${encodeURIComponent(runId)}/gates/${encodeURIComponent(stageName)}/reject`,
        { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({reason: reason||'rejected'}) });
      if (res.ok) { toast(`Rejected: ${stageName}`, 'success'); setTimeout(loadAll, 500); }
      else { const j = await res.json(); toast(`Error: ${j.error||res.status}`, 'error'); }
    } catch { toast('Request failed', 'error'); }
  }

  // ── SAGA ACTIONS ──────────────────────────────
  async function approveSaga(sagaId, seq) {
    const approver = prompt('Your name or email (recorded in audit trail):');
    if (approver === null) return;
    try {
      const res = await fetch(`/sagacity/approve/${encodeURIComponent(sagaId)}/${seq}`,
        { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({approver: approver||'unknown'}) });
      if (res.ok) { toast('✓ Approved', 'success'); setTimeout(loadAll, 500); }
      else { const j = await res.json(); toast(`Error: ${j.error||res.status}`, 'error'); }
    } catch { toast('Request failed', 'error'); }
  }

  async function rejectSaga(sagaId, seq) {
    const approver = prompt('Your name or email:');
    if (approver === null) return;
    try {
      const res = await fetch(`/sagacity/reject/${encodeURIComponent(sagaId)}/${seq}`,
        { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({approver: approver||'unknown'}) });
      if (res.ok) { toast('Rejected', 'success'); setTimeout(loadAll, 500); }
      else { const j = await res.json(); toast(`Error: ${j.error||res.status}`, 'error'); }
    } catch { toast('Request failed', 'error'); }
  }

  // ── HELPERS ───────────────────────────────────
  function statusBadge(status) {
    const map = {
      RUNNING:        ['badge-running',     '● Running'],
      PAUSED_AT_GATE: ['badge-gate',        '⏸ Gate'],
      COMPLETED:      ['badge-completed',   '✓ Completed'],
      FAILED:         ['badge-failed',      '✗ Failed'],
      COMPENSATING:   ['badge-compensating','⟲ Compensating'],
    };
    const [cls, label] = map[status] || ['', status];
    return `<span class="badge ${cls}">${label}</span>`;
  }

  function fmtTime(iso) {
    if (!iso) return '—';
    try { return new Date(iso).toLocaleString(undefined, {month:'short',day:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit'}); }
    catch { return iso; }
  }

  function esc(s) {
    return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function copyText(t) { navigator.clipboard?.writeText(t).then(() => toast('Copied', 'success')); }

  let toastTimer;
  function toast(msg, type) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.className = 'show ' + (type||'');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 3000);
  }

  // ── INIT ──────────────────────────────────────
  loadAll();
  setInterval(loadAll, 15000);
</script>
</body>
</html>
